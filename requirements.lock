# ZIX - versiones exactas del entorno verificado.
#
# Generado el 2026-10-03 con los hashes sha256 que publica PyPI, para que
# una instalacion limpia reciba EXACTAMENTE lo que se probo. Sin esto, un
# 'pip install' dentro de seis meses podria traerse una version alterada o
# rota de una dependencia.
#
# Instalacion reproducible:
#     python -m venv .venv
#     .\.venv\Scripts\python.exe -m pip install --require-hashes -r requirements.lock
#
# Verificado ese dia contra la API de OSV: 0 vulnerabilidades conocidas en
# las dependencias directas.
#
# Actualizado el 2026-10-19: la auditoria de ESTE fichero (no la de
# requirements.txt) encontro 9 CVEs que el CI no veia, porque requirements.txt
# no fija versiones y por eso resuelve siempre a la ultima publicada:
#
#   urllib3 2.7.0 -> 2.8.0  (PYSEC-2026-4175, -4176, -4177)
#       urllib3 va en el camino de PRODUCCION: lo arrastran requests y httpx,
#       que son los que usa el SDK de groq. Fix upstream directo.
#
#   pypdf 6.18.0: 6 CVEs (PYSEC-2026-4154, -4155, -4156, -4157, -4159,
#   -4160) -> NO se arregla subiendo de version: se elimina del lock.
#       pypdf, reportlab y pillow no los necesita NADA de ZIX. Los arrastra
#       pip-requirements-parser, que a su vez es dependencia de pip-audit, la
#       herramienta que audita este mismo fichero. Estaban en el lock porque
#       pip-compile vio lo que habia instalado en el entorno, no porque
#       algo declarado los pidiera. Por eso tampoco estan sus requirentes
#       (pip-audit, pip-requirements-parser): el lock era incoherente.
#       quitarlos de raiz es mejor que subirlos de version.
#
#   playwright 1.62.0 -> 1.63.0: requirements-dev.txt decia '>=1.63.0' desde
#       el commit 9401b08 (dependabot) y el lock no se regenero. Deriva
#       silenciosa: el lock fijaba una version que ya no cumplia lo declarado.
#
#   certifi 2026.7.22 -> 2026.10.19 (GHSA-6q48-6c7w-9gw2)
#       Aviso publicado el 2026-10-20, DESPUES de las auditorias anteriores
#       de esta revision, asi que aparecio en mitad del trabajo. No lo
#       introdujo este cambio: certifi no se habia tocado (verificado
#       comparando la version anterior de este fichero con la actual).
#       certifi empaqueta la raiz 'emSign ECC Root CA - G3', de la que
#       cuelgan 8 intermedios con claves privadas comprometidas. Un atacante
#       con esas claves puede emitir certificados para cualquier nombre de
#       dominio: si ademas esta en el camino, puede interceptar el TLS.
#       En ZIX importa de verdad: por ahi van la API key y, con STT en la
#       nube, el audio del usuario. La 2026.10.18 quito todas las raices
#       emSign; la 2026.10.19 devuelve las que no estan afectadas.
#
# Volvio a pasar 'pip-audit -r requirements.lock --require-hashes' con 0.
#
# Actualizado el 2026-10-24:
#
#   playwright 1.63.0 -> 1.64.1: Dependabot abrio el PR #5 para subir lo
#       declarado (requirements-dev.txt, '>=1.63.0' -> '>=1.64.0'). Se
#       actualiza aqui en el MISMO cambio que el lock: si se mezclara el
#       PR solo, lo declarado pediria >=1.64.0 y el lock seguiria fijando
#       1.63.0, que es exactamente la deriva silenciosa que este fichero
#       existe para impedir (ver 'playwright 1.62.0 -> 1.63.0' arriba).
#       greenlet 3.5.5 y pyee 13.0.1 siguen dentro de los rangos que pide
#       la 1.64.1 (greenlet>=3.1.1,<4 ; pyee>=13,<15): no hay cambios
#       transitivos. Los 8 hashes son los sha256 que PyPI publica para
#       TODOS los wheels de la 1.64.1 (win32, win_amd64, win_arm64,
#       macos x86_64/arm64/universal2 y manylinux x86_64/aarch64).
#
# 'zix' no aparece: es el propio paquete, se instala con 'pip install -e .'.
# 'pip-audit' tampoco: es la herramienta que audita este fichero, no parte
# del entorno que audita. Se instala aparte: pip install "pip-audit>=2.10.1"
#
# 'pip' SI aparece, a proposito: fijar tambien el instalador hace la
# instalacion reproducible de verdad.
#
# Comprobado que este lock NO contiene dependencias huerfanas: las 45 entradas
# son alcanzables desde lo declarado en requirements.txt y
# requirements-dev.txt. Lo verifica scripts/check_lock_sync.py y el job de
# reproducibilidad del CI.

