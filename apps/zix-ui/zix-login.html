<!doctype html>
<html lang="es"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- CSP: pagina estatica sin backend. connect-src 'none' garantiza que no
       pueda salir nada a la red. Sin frame-ancestors porque los navegadores
       lo ignoran dentro de un meta. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'">
  <title>ZIX IA — Iniciar Sesión</title>
  <style>
    :root {
      --bg:      #ffffff;
      --surface: #f8f9fa;
      --fg:      #1a1a2e;
      --muted:   #6b7280;
      --border:  #e5e7eb;
      --accent:  #2563eb;

      --accent-soft: color-mix(in oklch, var(--accent) 12%, transparent);
      --fg-soft:     color-mix(in oklch, var(--fg) 5%, transparent);

      --font-display: 'Charter', 'Iowan Old Style', Georgia, 'Times New Roman', serif;
      --font-body:    'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      --font-mono:    ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace;

      --fs-h1: clamp(36px, 5vw, 48px);
      --fs-h2: clamp(24px, 3vw, 32px);
      --fs-h3: 18px;
      --fs-lead: 16px;
      --fs-body: 15px;
      --fs-meta: 13px;

      --gap-xs: 8px;
      --gap-sm: 12px;
      --gap-md: 20px;
      --gap-lg: 32px;
      --gap-xl: 56px;

      --radius: 10px;
      --radius-lg: 16px;
    }

    /* ─── Dark theme: sigue a principal (clave 'zix-theme') ─────── */
    [data-theme="dark"] {
      --bg:      #0f0f13;
      --surface: #17171d;
      --fg:      #eef0f4;
      --muted:   #a1a7b3;
      --border:  #26262e;
      --accent:  #60a5fa;

      --accent-soft: color-mix(in oklch, var(--accent) 18%, transparent);
      --fg-soft:     color-mix(in oklch, var(--fg) 8%, transparent);
    }

    /* Transición suave de tema (clase temporal al cambiar) */
    html.theme-anim, html.theme-anim *, html.theme-anim *::before, html.theme-anim *::after {
      transition: background-color 0.45s ease, border-color 0.45s ease, color 0.45s ease, box-shadow 0.45s ease !important;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 80%, color-mix(in oklch, var(--accent) 4%, transparent), transparent),
        radial-gradient(ellipse 60% 50% at 85% 20%, color-mix(in oklch, var(--accent) 3%, transparent), transparent),
        var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      font-size: var(--fs-body);
      line-height: 1.55;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
    }

    /* Transición limpia entre pantallas (entrada + salida) */
    body.page-in {
      opacity: 1;
      transition: opacity 0.35s ease;
    }

    body.page-out {
      opacity: 0;
      transition: opacity 0.22s ease;
    }

    @media (prefers-reduced-motion: reduce) {
      body { opacity: 1; }
      body.page-in, body.page-out { transition: none; }
    }

    /* ─── screens ──────────────────────────────────────────────────────── */
    .screen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    .screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* ─── login card ───────────────────────────────────────────────────── */
    .login-card {
      width: 100%;
      max-width: 400px;
      padding: 48px 40px;
      margin: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: 0 1px 3px color-mix(in oklch, var(--fg) 4%, transparent);
    }

    .brand {
      text-align: center;
      margin-bottom: 40px;
    }
    .brand h1 {
      font-family: var(--font-display);
      font-size: var(--fs-h1);
      font-weight: 700;
      letter-spacing: -0.03em;
      margin: 0;
      line-height: 1.1;
    }
    .brand .subtitle {
      font-size: var(--fs-lead);
      color: var(--muted);
      margin: 8px 0 0;
    }
    .brand .version {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--muted);
      margin-top: 6px;
      letter-spacing: 0.04em;
    }

    /* ─── form ─────────────────────────────────────────────────────────── */
    .form-stack {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 12px 20px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--fg);
      font: inherit;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: transform 0.05s ease, background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .btn:active { transform: translateY(1px); }
    .btn:hover {
      border-color: var(--fg);
      background: var(--fg-soft);
    }
    .btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .btn svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    /* ─── entrance to Home ─────────────────────────────────────── */
    .enter-wrap {
      margin-top: 24px;
      opacity: 0;
      visibility: hidden;
      transform: translateY(4px);
      transition: opacity 0.4s ease, transform 0.4s ease, visibility 0.4s;
    }
    .enter-wrap.visible {
      opacity: 1;
      visibility: visible;
      transform: none;
    }
    .enter-wrap .btn {
      text-decoration: none;
    }
    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }
    .btn-primary:hover {
      background: color-mix(in oklch, var(--accent) 82%, black);
      border-color: color-mix(in oklch, var(--accent) 82%, black);
    }
    [data-theme="dark"] .btn-primary {
      color: #0a0f1e;
    }

    /* Deshabilitado: opacidad 0.4 y ningún cambio de color.
       Patrón "Pendiente" del design system: el control se ve, pero no
       promete una función que el backend todavía no tiene. */
    .btn:disabled,
    .btn[aria-disabled="true"] {
      opacity: 0.4;
      cursor: default;
    }
    .btn:disabled:hover,
    .btn[aria-disabled="true"]:hover {
      border-color: var(--border);
      background: var(--bg);
    }
    .btn-primary:disabled:hover,
    .btn-primary[aria-disabled="true"]:hover {
      background: var(--accent);
      border-color: var(--accent);
    }
    .btn:disabled:active,
    .btn[aria-disabled="true"]:active { transform: none; }

    /* ─── download screen ──────────────────────────────────────────────── */
    .download-content {
      text-align: center;
      max-width: 360px;
      padding: 48px 40px;
    }
    .download-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 24px;
      background: var(--accent-soft);
      border-radius: 50%;
      display: grid;
      place-items: center;
      animation: pulse-ring 2s ease-in-out infinite;
    }
    .download-icon svg {
      width: 28px;
      height: 28px;
      color: var(--accent);
      animation: bounce-down 1.5s ease-in-out infinite;
    }
    @keyframes pulse-ring {
      0%, 100% { box-shadow: 0 0 0 0 var(--accent-soft); }
      50% { box-shadow: 0 0 0 12px transparent; }
    }
    @keyframes bounce-down {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(4px); }
    }

    .download-content h2 {
      font-family: var(--font-display);
      font-size: var(--fs-h2);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0 0 8px;
    }
    .download-content .lead {
      font-size: var(--fs-lead);
      color: var(--muted);
      margin: 0 0 32px;
    }

    .progress-track {
      width: 100%;
      height: 6px;
      background: var(--border);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 999px;
      width: 0%;
      transition: width 0.4s ease;
    }

    .progress-status {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .progress-status .status-text {
      font-size: 13px;
      color: var(--muted);
    }
    .progress-status .status-pct {
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--accent);
      font-weight: 600;
    }

    .resource-list {
      margin-top: 32px;
      text-align: left;
    }
    .resource-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
      color: var(--muted);
    }
    .resource-item:last-child {
      border-bottom: none;
    }
    .resource-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--border);
      flex-shrink: 0;
      transition: background 0.3s ease;
    }
    .resource-dot.done {
      background: var(--accent);
    }
    .resource-item.done {
      color: var(--fg);
    }
    .resource-check {
      margin-left: auto;
      opacity: 0;
      transition: opacity 0.3s ease;
      color: var(--accent);
    }
    .resource-item.done .resource-check {
      opacity: 1;
    }

    /* ─── responsive ───────────────────────────────────────────────────── */
    @media (max-width: 480px) {
      .login-card {
        padding: 36px 24px;
        margin: 16px;
      }
      .download-content {
        padding: 36px 24px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .download-icon,
      .download-icon svg { animation: none; }
      .progress-fill { transition: none; }
      .resource-dot { transition: none; }
      .resource-check { transition: none; }
      .screen { transition: opacity 0.15s ease, visibility 0.15s ease; }
    }

    .branding {
      position: fixed;
      bottom: 20px;
      right: 28px;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.02em;
      opacity: 0.6;
      pointer-events: none;
    }
  </style>
  <script>
    // Tema inicial sin parpadeo: misma clave que la principal ('zix-theme').
    // Por defecto sigue al sistema (oscuro si la PC está en dark).
    (function () {
      var root = document.documentElement;
      var animT = 0;
      function pulse() {
        root.classList.remove('theme-anim');
        void root.offsetWidth;
        root.classList.add('theme-anim');
        clearTimeout(animT);
        animT = setTimeout(function () { root.classList.remove('theme-anim'); }, 550);
      }
      function resolve() {
        var saved = null;
        try { saved = localStorage.getItem('zix-theme'); } catch (_) {}
        var mode = (saved === 'dark' || saved === 'light' || saved === 'system') ? saved : 'system';
        var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var next = dark ? 'dark' : 'light';
        if (root.getAttribute('data-theme') && root.getAttribute('data-theme') !== next) pulse();
        root.setAttribute('data-theme', next);
      }
      resolve();
      try {
        var mq = window.matchMedia('(prefers-color-scheme: dark)');
        if (mq.addEventListener) mq.addEventListener('change', resolve);
        else if (mq.addListener) mq.addListener(resolve);
      } catch (_) {}
    })();
  </script>
  <noscript><style>body { opacity: 1; }</style></noscript>
</head>
<body>

  <!-- ═══════════════════════════════════════════════════════════════════════
       SCREEN 1 — LOGIN
       Los dos botones OAuth están deshabilitados: ZIX no tiene autenticación
       todavía. Se conserva la representación visual aprobada.
       ═══════════════════════════════════════════════════════════════════════ -->
  <section class="screen" id="screen-login" data-od-id="login-screen">
    <div class="login-card" data-od-id="login-card">
      <div class="brand" data-od-id="login-brand">
        <h1>ZIX IA</h1>
        <p class="subtitle">Asistente de Voz</p>
        <p class="version">Versión 0.2</p>
      </div>

      <div class="form-stack" id="login-form" data-od-id="login-form">
        <button class="btn" type="button" id="btn-google" data-od-id="btn-google" disabled data-estado="no-disponible">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
          Iniciar sesión con Google
        </button>
        <button class="btn" type="button" id="btn-github" data-od-id="btn-github" disabled data-estado="no-disponible">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
          Iniciar sesión con GitHub
        </button>
      </div>
    </div>
  </section>

  <!-- ═══════════════════════════════════════════════════════════════════════
       SCREEN 2 — DOWNLOADING RESOURCES
       Estado VISUAL. No descarga nada: no toca setup_voice_models.py, no
       instala modelos, no escribe en disco. El progreso lo paints setStep() ;
       ahí se enchufa el progreso real cuando exista.
       ═══════════════════════════════════════════════════════════════════════ -->
  <section class="screen hidden" id="screen-download" data-od-id="download-screen">
    <div class="download-content" data-od-id="download-content">
      <div class="download-icon" data-od-id="download-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
      </div>
      <h2>Descargando recursos</h2>
      <p class="lead">Preparando tu asistente de voz...</p>

      <div class="progress-track" id="progress-track" data-od-id="progress-track"
           role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"
           aria-label="Progreso de la descarga">
        <div class="progress-fill" id="progress-fill" data-od-id="progress-fill"></div>
      </div>
      <div class="progress-status">
        <span class="status-text" id="status-text" data-od-id="progress-status" aria-live="polite">Inicializando...</span>
        <span class="status-pct" id="status-pct" data-od-id="progress-pct">0%</span>
      </div>

      <div class="resource-list" id="resource-list" data-od-id="resource-list">
        <div class="resource-item" data-step="0">
          <span class="resource-dot"></span>
          <span>Motor de reconocimiento de voz</span>
          <span class="resource-check">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </span>
        </div>
        <div class="resource-item" data-step="1">
          <span class="resource-dot"></span>
          <span>Modelo de lenguaje natural</span>
          <span class="resource-check">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </span>
        </div>
        <div class="resource-item" data-step="2">
          <span class="resource-dot"></span>
          <span>Sub-agentes de control</span>
          <span class="resource-check">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </span>
        </div>
        <div class="resource-item" data-step="3">
          <span class="resource-dot"></span>
          <span>Interfaz de usuario</span>
          <span class="resource-check">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </span>
        </div>
      </div>
    </div>

    <div class="enter-wrap" id="enter-wrap" data-od-id="enter-home">
      <a class="btn btn-primary" id="btn-enter" href="zix-config.html" data-od-id="btn-enter">Entrar a ZIX</a>
    </div>
  </section>

  <span class="branding">By ZIX Technology</span>

  <script>
    (function () {
      const loginScreen = document.getElementById('screen-login');
      const downloadScreen = document.getElementById('screen-download');
      const progressTrack = document.getElementById('progress-track');
      const progressFill = document.getElementById('progress-fill');
      const statusText = document.getElementById('status-text');
      const statusPct = document.getElementById('status-pct');
      const resourceList = document.getElementById('resource-list');
      const enterWrap = document.getElementById('enter-wrap');
      const enterLink = document.getElementById('btn-enter');
      let enterTimer = 0;
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      // Destinos del flujo aprobado: LOGIN -> DESCARGA -> CONFIG -> HOME -> CHAT.
      // Destino único: la descarga de recursos siempre entra a Configuración.
      // El login NO decide si la voz ya está configurada; esa decisión vive
      // en un solo sitio, zix-config.html. Aquí no se lee zix-voice-setup.
      const NEXT_SCREEN = 'zix-config.html';
      function nextScreen() { return NEXT_SCREEN; }

      if (enterLink) enterLink.href = nextScreen();

      // Transición limpia entre pantallas (entrada + salida)
      function pageIn() {
        if (reduceMotion) return;
        document.body.classList.add('page-in');
      }
      function goNext() {
        clearTimeout(enterTimer);
        const target = nextScreen();
        if (reduceMotion) { window.location.href = target; return; }
        document.body.classList.add('page-out');
        setTimeout(() => { window.location.href = target; }, 230);
      }
      pageIn();

      const steps = [
        { label: 'Descargando motor de voz...', pct: 25 },
        { label: 'Cargando modelo de lenguaje...', pct: 50 },
        { label: 'Configurando sub-agentes...', pct: 75 },
        { label: 'Preparando interfaz...', pct: 100 }
      ];

      // Punto único de pintado del estado. El progreso real se enchufa aquí.
      function setStep(index) {
        const step = steps[index];
        statusText.textContent = step.label;
        progressFill.style.width = step.pct + '%';
        statusPct.textContent = step.pct + '%';
        progressTrack.setAttribute('aria-valuenow', String(step.pct));
        const item = resourceList.querySelector('.resource-item[data-step="' + index + '"]');
        if (item) {
          item.classList.add('done');
          item.querySelector('.resource-dot').classList.add('done');
        }
      }

      function showDownload() {
        loginScreen.classList.add('hidden');
        downloadScreen.classList.remove('hidden');
        runDownload();
      }

      // Secuencia visual: NO descarga nada. Al terminar ofrece el CTA y,
      // si la pantalla destino existe, la entrada automática de ~2.2s.
      function runDownload() {
        let current = 0;

        function nextStep() {
          if (current >= steps.length) {
            statusText.textContent = 'Listo';
            enterWrap.classList.add('visible');
            clearTimeout(enterTimer);
            enterTimer = setTimeout(() => { goNext(); }, 2200);
            return;
          }
          setStep(current);
          current++;
          setTimeout(nextStep, 1200 + Math.random() * 600);
        }

        setTimeout(nextStep, 500);
      }

      enterLink.addEventListener('click', (e) => { e.preventDefault(); goNext(); });

      // Vista directa al estado de descarga para revisión visual en preview.
      // Entra por el mismo showDownload() que usará la autenticación real.
      function abrirDescarga() {
        if (window.location.hash === '#descarga') showDownload();
      }
      window.addEventListener('hashchange', abrirDescarga);
      abrirDescarga();
    })();
  </script>


</body></html>
