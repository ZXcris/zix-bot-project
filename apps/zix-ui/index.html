/* Organic fluid morphing keyframes for sentient liquid orb */
@keyframes morphBlob1 {
  0% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; transform: rotate(0deg) scale(1); }
  34% { border-radius: 40% 60% 50% 50% / 30% 60% 40% 70%; transform: rotate(120deg) scale(1.05); }
  67% { border-radius: 70% 30% 60% 40% / 50% 40% 60% 50%; transform: rotate(240deg) scale(0.97); }
  100% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; transform: rotate(360deg) scale(1); }
}

@keyframes morphBlob2 {
  0% { border-radius: 45% 55% 65% 35% / 50% 45% 55% 50%; transform: rotate(0deg) scale(1.02); }
  33% { border-radius: 65% 35% 45% 55% / 40% 60% 40% 60%; transform: rotate(-120deg) scale(0.96); }
  66% { border-radius: 35% 65% 50% 50% / 60% 35% 65% 40%; transform: rotate(-240deg) scale(1.06); }
  100% { border-radius: 45% 55% 65% 35% / 50% 45% 55% 50%; transform: rotate(-360deg) scale(1.02); }
}

@keyframes morphBlob3 {
  0% { border-radius: 50% 50% 35% 65% / 45% 60% 40% 55%; transform: rotate(0deg) scale(0.98); }
  50% { border-radius: 60% 40% 60% 40% / 55% 40% 60% 45%; transform: rotate(180deg) scale(1.07); }
  100% { border-radius: 50% 50% 35% 65% / 45% 60% 40% 55%; transform: rotate(360deg) scale(0.98); }
}

@keyframes gentleBreath {
  0%, 100% { transform: scale(1); opacity: 0.85; }
  50% { transform: scale(1.04); opacity: 1; }
}

@keyframes activePulseEnergy {
  0%, 100% { transform: scale(1.02); filter: drop-shadow(0 0 35px rgba(123, 240, 255, 0.45)); }
  50% { transform: scale(1.12); filter: drop-shadow(0 0 60px rgba(123, 240, 255, 0.75)) drop-shadow(0 0 100px rgba(56, 189, 248, 0.4)); }
}

@keyframes rippleEmanation {
  0% { transform: scale(0.85); opacity: 0.7; }
  100% { transform: scale(1.55); opacity: 0; }
}

.animate-blob-1 {
  animation: morphBlob1 18s ease-in-out infinite;
}
.animate-blob-2 {
  animation: morphBlob2 15s ease-in-out infinite;
}
.animate-blob-3 {
  animation: morphBlob3 22s ease-in-out infinite;
}
.animate-breath {
  animation: gentleBreath 7s ease-in-out infinite;
}

/* Hover/active del orbe con la propiedad independiente `scale`, que se compone
   con las animaciones de `transform` (breath/pulse) en vez de ser anulada por ellas */
#orb-assembly:hover { scale: 1.04; }
#orb-assembly:active { scale: .95; }

/* Transiciones persistentes de estado orbe/botón: al vivir en CSS estático (no en
   las clases que se intercambian), cada cambio de valor desliza en vez de saltar.
   Los gradientes (background-image) no son animables y cambian al instante,
   enmascarados por la opacidad/filtro que sí se animan. */
#orb-assembly, #orb-outer-glow, #orb-nucleus-core, #ambient-aura, #secondary-aura,
#presence-badge, #core-state-text, #sub-status, #pill-text, #pill-icon, #orb-hint-pill {

}

}

}

<script>
  (function initZixInterface() {
    // Algunos IDs del panel de voz no existen en este DOM: se mapean a los
    // elementos reales (orb-hint-pill / pill-icon / pill-text) y el resto se
    // protege con guardas para no romper las animaciones del orbe.
    const triggerBtn = document.getElementById('voice-trigger-btn') || document.getElementById('orb-hint-pill');
    const pulseRing = document.getElementById('mic-pulse-ring');
    const orbAssembly = document.getElementById('orb-assembly');
    const orbOuterGlow = document.getElementById('orb-outer-glow');
    const orbNucleusCore = document.getElementById('orb-nucleus-core');
    const coreStateDot = document.getElementById('core-state-dot');
    const coreStateText = document.getElementById('core-state-text');
    const presenceBadge = document.getElementById('presence-badge');
    const subStatus = document.getElementById('sub-status');
    const voiceBtnLabel = document.getElementById('voice-btn-label') || document.getElementById('pill-text');
    const voiceBtnHint = document.getElementById('voice-btn-hint');
    const iconMic = document.getElementById('icon-mic') || document.getElementById('pill-icon');
    const iconStop = document.getElementById('icon-stop');
    const btnInfo = document.getElementById('btn-info');
    const infoPanel = document.getElementById('info-panel');
    const ambientAura = document.getElementById('ambient-aura');
    const secondaryAura = document.getElementById('secondary-aura');
    const mainContainer = document.querySelector('main > div') || document.body;

    let isListening = false;

    // Fundido de textos al cambiar de estado: baja opacidad, intercambia el
    // contenido y la sube. Con token por elemento para no encimar fundidos
    // si el usuario alterna rápido entre estados.
    const fadeTokens = new WeakMap();
    function fadeSwap(el, apply) {
      if (!el || typeof apply !== 'function') return;
      const t = (fadeTokens.get(el) || 0) + 1;
      fadeTokens.set(el, t);
      el.style.transition = 'opacity .16s ease';
      el.style.opacity = '0';
      setTimeout(() => {
        if (fadeTokens.get(el) !== t) return;
        apply();
        el.style.opacity = '1';
      }, 160);
    }

    function activateListening() {
      isListening = true;
      mainContainer.classList.add('state-listening');

      // Top Badge dynamic pulse & label
      coreStateDot.className = "w-2 h-2 rounded-full bg-primary-container shadow-[0_0_12px_#7bf0ff] animate-ping";
      fadeSwap(coreStateText, () => { coreStateText.textContent = "ESCUCHANDO..."; });
      coreStateText.className = "font-label-sm text-label-sm text-primary tracking-widest uppercase font-semibold";
      presenceBadge.className = "flex items-center gap-space-xs px-4 py-1.5 rounded-full bg-surface-container-high/60 backdrop-blur-xl border border-primary-container/30 shadow-[0_0_20px_rgba(123,240,255,0.25)] transition-all duration-500";

      // Subtitle feedback
      fadeSwap(subStatus, () => { subStatus.textContent = "Escuchando... Te atiendo ahora."; });
      subStatus.className = "font-body-sm text-body-sm text-primary mt-1.5 tracking-wide font-normal";

      // Orb energy bloom & responsiveness
      orbOuterGlow.className = "absolute -inset-14 rounded-full bg-gradient-to-tr from-[#7bf0ff]/35 via-[#38bdf8]/30 to-[#818cf8]/25 blur-3xl opacity-90 transition-all duration-700 pointer-events-none";
      orbNucleusCore.className = "absolute w-32 h-32 sm:w-36 sm:h-36 rounded-full bg-gradient-to-tr from-white via-[#7bf0ff] to-[#38bdf8] blur-md opacity-95 pointer-events-none shadow-[0_0_70px_rgba(123,240,255,0.95)]";
      ambientAura.className = "w-[840px] h-[840px] rounded-full bg-gradient-to-tr from-surface-tint/25 via-[#38bdf8]/20 to-transparent blur-[140px] transition-all duration-1000 ease-out opacity-75 scale-110";
      secondaryAura.className = "absolute w-[520px] h-[520px] rounded-full bg-[#818cf8]/25 blur-[100px] opacity-50 scale-110 transition-all duration-700";

      // Button state changes: Stop icon & radiant cyan glow
      if (iconMic) {
        if (iconMic.id === 'pill-icon') fadeSwap(iconMic, () => { iconMic.textContent = 'stop'; });
        else { iconMic.classList.add('hidden'); iconMic.classList.remove('flex'); }
      }
      if (iconStop) { iconStop.classList.remove('hidden'); iconStop.classList.add('flex'); }

      if (pulseRing) {
        pulseRing.classList.remove('opacity-0', 'scale-90');
        pulseRing.classList.add('opacity-100', 'scale-125', 'bg-primary-container/30');
      }

      if (triggerBtn) triggerBtn.classList.add('border-primary-container/60', 'shadow-[0_0_30px_rgba(123,240,255,0.4),inset_0_1px_2px_rgba(255,255,255,0.7)]');
      fadeSwap(voiceBtnLabel, () => { voiceBtnLabel.textContent = "Detener"; });
      if (voiceBtnHint) voiceBtnHint.innerHTML = "Presiona para finalizar o permanece en silencio";
    }

    function deactivateListening() {
      isListening = false;
      mainContainer.classList.remove('state-listening');

      // Top Badge calm state
      coreStateDot.className = "w-2 h-2 rounded-full bg-surface-tint shadow-[0_0_8px_rgba(95,215,230,0.8)]";
      fadeSwap(coreStateText, () => { coreStateText.textContent = "EN ESPERA"; });
      coreStateText.className = "font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest";
      presenceBadge.className = "flex items-center gap-space-xs px-4 py-1.5 rounded-full bg-surface-container-low/40 backdrop-blur-xl shadow-[inset_0_1px_1px_0_rgba(255,255,255,0.08)] border border-white/[0.04] transition-all duration-500";

      // Subtitle return
      fadeSwap(subStatus, () => { subStatus.textContent = "Esperando que le hables."; });
      subStatus.className = "font-body-sm text-body-sm text-on-surface-variant mt-1.5 tracking-wide";

      // Orb returns to serene fluid breathing
      orbOuterGlow.className = "absolute -inset-10 rounded-full bg-gradient-to-tr from-[#7bf0ff]/20 via-[#38bdf8]/15 to-[#818cf8]/15 blur-3xl opacity-60 transition-all duration-700 pointer-events-none";
      orbNucleusCore.className = "absolute w-28 h-28 sm:w-32 sm:h-32 rounded-full bg-gradient-to-tr from-white/90 via-[#7bf0ff]/80 to-[#38bdf8]/60 blur-md opacity-90 animate-breath pointer-events-none shadow-[0_0_50px_rgba(123,240,255,0.85)]";
      ambientAura.className = "w-[740px] h-[740px] rounded-full bg-gradient-to-tr from-surface-tint/15 via-[#38bdf8]/10 to-transparent blur-[140px] transition-all duration-1000 ease-out opacity-45";
      secondaryAura.className = "absolute w-[440px] h-[440px] rounded-full bg-[#818cf8]/15 blur-[100px] opacity-30 transition-all duration-700";

      // Button returns to mic
      if (iconStop) { iconStop.classList.add('hidden'); iconStop.classList.remove('flex'); }
      if (iconMic) {
        if (iconMic.id === 'pill-icon') fadeSwap(iconMic, () => { iconMic.textContent = 'mic'; });
        else { iconMic.classList.remove('hidden'); iconMic.classList.add('flex'); }
      }

      if (pulseRing) {
        pulseRing.classList.remove('opacity-100', 'scale-125', 'bg-primary-container/30');
        pulseRing.classList.add('opacity-0', 'scale-90');
      }

      if (triggerBtn) triggerBtn.classList.remove('border-primary-container/60', 'shadow-[0_0_30px_rgba(123,240,255,0.4),inset_0_1px_2px_rgba(255,255,255,0.7)]');
      fadeSwap(voiceBtnLabel, () => { voiceBtnLabel.textContent = "Hablar con ZIX"; });
      if (voiceBtnHint) voiceBtnHint.innerHTML = 'Presiona para activar el micrófono o di <span class="text-on-surface-variant normal-case font-body-sm font-normal">"Hola ZIX"</span>';
    }

    function toggleVoiceState() {
      if (!isListening) {
        activateListening();
      } else {
        deactivateListening();
      }
    }

    if (triggerBtn) triggerBtn.addEventListener('click', toggleVoiceState);
    if (orbAssembly) orbAssembly.addEventListener('click', toggleVoiceState);

    // Toggle Info Dialog Overlay
    if (btnInfo && infoPanel) btnInfo.addEventListener('click', (e) => {
      e.stopPropagation();
      const isVisible = !infoPanel.classList.contains('opacity-0');
      if (isVisible) {
        infoPanel.classList.add('opacity-0', 'pointer-events-none', 'translate-y-2');
      } else {
        infoPanel.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-2');
      }
    });

    document.addEventListener('click', (e) => {
      if (infoPanel && !infoPanel.contains(e.target) && e.target !== btnInfo) {
        infoPanel.classList.add('opacity-0', 'pointer-events-none', 'translate-y-2');
      }
    });
  })();
</script></main>

</body></html>
