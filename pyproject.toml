[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zix"
version = "0.2.0"
description = "ZIX-PC: asistente personal de IA por voz para Windows (núcleo del agente + pipeline de voz)"
requires-python = ">=3.10"
dependencies = [
    "groq",
    "python-dotenv",
    "openwakeword",
    "sounddevice",
    "numpy",
    "piper-tts",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]