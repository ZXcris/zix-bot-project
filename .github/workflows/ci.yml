name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# El token por defecto no necesita escribir nada: el CI solo lee y prueba.
# Declararlo aqui evita que un workflow introducido por un tercero reciba
# permisos de escritura por accidente.
permissions:
  contents: read

# Cancela ejecuciones anteriores del mismo ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: pytest (Windows y Linux)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # En Linux el wheel de sounddevice instala, pero al importar necesita
      # la libreria de PortAudio, que el runner no trae. Sin esto, cualquier
      # test que toque el modulo de audio falla con OSError.
      - name: PortAudio (solo Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq portaudio19-dev libsndfile1

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # openwakeword NO trae sus modelos .onnx en el paquete de pip. Sin esto,
      # el VAD de Silero no arranca y decidir_subida no puede filtrar.
      #
      # continue-on-error a proposito: la suite NO depende de que la descarga
      # funcione (los tests que miden a Silero se saltan sin el, y la logica
      # del freno se prueba siempre con un VAD simulado). Si esta descarga
      # falla en un runner, eso es un problema de red o del runner, no del
      # codigo, y no debe poner rojo el CI. El aviso se ve igual: aparecen
      # mas tests saltados.
      - name: Descargar los modelos de openWakeWord
        continue-on-error: true
        run: python scripts/setup_openwakeword_models.py

      - name: Suite completa
        # shell: bash explicito. Por defecto Windows usa PowerShell, donde
        # 'set -o pipefail' no existe y el paso muere antes de testear nada.
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tests/ -q 2>&1 | tee pytest-${{ matrix.os }}.txt

      # Un fallo aqui dice solo 'algo se rompio'. Separado por areas, el paso
      # que se pone rojo dice si fue la UI, la voz o el nucleo, que es la
      # primera pregunta cuando se mira una ejecucion roja.
      # always() porque si la suite entera falla, estos son los que dicen
      # DONDE.
      - name: Tests de interfaz
        if: always()
        run: python -m pytest tests/ -q -k "chat or home or config or login or seguridad"

      - name: Tests de voz y privacidad
        if: always()
        run: python -m pytest tests/test_privacidad_stt.py tests/test_conversation.py tests/test_vad.py tests/test_audio.py -q

      - name: Tests del nucleo
        if: always()
        run: >-
          python -m pytest tests/ -q
          --ignore=tests/test_zix_chat_ui.py
          --ignore=tests/test_zix_config_ui.py
          --ignore=tests/test_zix_home_ui.py
          --ignore=tests/test_zix_home_vacios.py
          --ignore=tests/test_zix_login_ui.py
          --ignore=tests/test_zix_ui_seguridad.py
          --ignore=tests/test_privacidad_stt.py
          --ignore=tests/test_conversation.py
          --ignore=tests/test_vad.py
          --ignore=tests/test_audio.py

      # Guardar el informe aunque los tests fallen. En el log de GitHub solo
      # se ven los ultimos kilobytes y a veces hay que mirar justo el que
      # importa; aqui queda entero y se descarga desde la ejecucion.
      - name: Subir el informe de los tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.os }}
          path: pytest-${{ matrix.os }}.txt
          if-no-files-found: ignore

  interfaz:
    name: Comprobaciones de la interfaz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: PortAudio
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq portaudio19-dev libsndfile1

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # Mismo motivo que en el job de pruebas, y mismo criterio: si falla, se ve
      # en los skips, no como un fallo del codigo.
      - name: Descargar los modelos de openWakeWord
        continue-on-error: true
        run: python scripts/setup_openwakeword_models.py

      - name: Comprobar que la UI no inventa datos ni sale a la red
        run: python -m pytest tests/ -q -k "chat or home or config or login or seguridad"

  dependencias:
    name: CVEs conocidas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Auditar las dependencias declaradas
        run: |
          python -m pip install --upgrade pip-audit
          # Auditar requirements.txt, NO el entorno instalado.
          #
          # Antes era 'pip_audit --strict' a secas, y este job no instala el
          # proyecto: auditaba el entorno base de Ubuntu (pip, setuptools) y
          # se daba por bueno. No miraba ninguna dependencia nuestra, o sea
          # que hacia exactamente nada.
          #
          # Con -r se resuelven las declaradas. Tambien evita el otro fallo:
          # 'zix' es un paquete local que no esta en PyPI, y al auditar el
          # entorno abortaba con exit 1 en todos los push.
          python -m pip_audit -r requirements.txt --strict --progress-spinner off

  secretos:
    name: Secretos en el historial
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks necesita TODO el historial. Sin esto solo veria el
          # ultimo commit y un secreto ya reescrito pasaria desapercibido.
          fetch-depth: 0

      - name: Descargar gitleaks (version y checksum fijados)
        run: |
          set -euo pipefail
          VERSION=8.30.1
          SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version

      - name: Escanear el repositorio completo
        run: |
          # --redact no imprime el secreto en el log del CI, que tambien
          # queda registrado en GitHub durante 90 dias.
          /tmp/gitleaks detect \
            --source . \
            --redact \
            --no-banner \
            --exit-code 1

      - name: El .env de ejemplo no debe traer valores reales
        run: |
          if grep -nEi '(KEY|TOKEN|SECRET|PASSWORD)[[:space:]]*=[[:space:]]*[^[:space:]#]{8,}' .env.example; then
            echo "::error::.env.example parece contener un valor real, no un marcador"
            exit 1
          fi
          echo ".env.example limpio"
