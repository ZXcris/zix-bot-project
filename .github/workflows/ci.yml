name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# El token por defecto no necesita escribir nada: el CI solo lee y prueba.
# Declararlo aqui evita que un workflow introducido por un tercero reciba
# permisos de escritura por accidente.
permissions:
  contents: read

# Cancela ejecuciones anteriores del mismo ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: pytest (Windows y Linux)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # En Linux el wheel de sounddevice instala, pero al importar necesita
      # la libreria de PortAudio, que el runner no trae. Sin esto, cualquier
      # test que toque el modulo de audio falla con OSError.
      - name: PortAudio (solo Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq portaudio19-dev libsndfile1

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # openwakeword NO trae sus modelos .onnx en el paquete de pip. Sin esto,
      # el VAD de Silero no arranca y decidir_subida no puede filtrar.
      #
      # continue-on-error a proposito: la suite NO depende de que la descarga
      # funcione (los tests que miden a Silero se saltan sin el, y la logica
      # del freno se prueba siempre con un VAD simulado). Si esta descarga
      # falla en un runner, eso es un problema de red o del runner, no del
      # codigo, y no debe poner rojo el CI. El aviso se ve igual: aparecen
      # mas tests saltados.
      - name: Descargar los modelos de openWakeWord
        continue-on-error: true
        run: python scripts/setup_openwakeword_models.py

      - name: Comprobar los modelos de openWakeWord
        # shell: bash explicito. Sin esto, en Windows este paso corre bajo
        # PowerShell y la sintaxis de bash da ParserError: el job se pone
        # rojo por un script que en realidad no llego a ejecutarse.
        shell: bash
        # El paso anterior puede fallar solo por la red. Aqui se mira el
        # resultado y se dice con nombre y apellidos, en vez de dejar que
        # los tests se omitan sin que quede constancia.
        #
        # NO tumba el job: una descarga fallida no es un fallo del codigo.
        # Lo que si hace es dejar un aviso visible en el resumen de la
        # ejecucion, y los tests que dependen de estos modelos se OMITEN
        # (skip), no se dan por aprobados.
        run: |
          codigo=0
          python scripts/setup_openwakeword_models.py --comprobar || codigo=$?
          if [ "$codigo" -ne 0 ]; then
            echo "::warning::Faltan modelos de openWakeWord (la red o el runner fallaron). Los tests que miden audio real se OMITEN, no se aprueban."
          fi
          exit 0

      - name: Suite completa
        # shell: bash explicito. Por defecto Windows usa PowerShell, donde
        # 'set -o pipefail' no existe y el paso muere antes de testear nada.
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tests/ -q 2>&1 | tee pytest-${{ matrix.os }}.txt

      # Un fallo aqui dice solo 'algo se rompio'. Separado por areas, el paso
      # que se pone rojo dice si fue la UI, la voz o el nucleo, que es la
      # primera pregunta cuando se mira una ejecucion roja.
      # always() porque si la suite entera falla, estos son los que dicen
      # DONDE.
      - name: Tests de interfaz
        if: always()
        run: python -m pytest tests/ -q -k "chat or home or config or login or seguridad"

      - name: Tests de voz y privacidad
        if: always()
        run: python -m pytest tests/test_privacidad_stt.py tests/test_conversation.py tests/test_vad.py tests/test_audio.py -q

      - name: Tests del nucleo
        if: always()
        run: >-
          python -m pytest tests/ -q
          --ignore=tests/test_zix_chat_ui.py
          --ignore=tests/test_zix_config_ui.py
          --ignore=tests/test_zix_home_ui.py
          --ignore=tests/test_zix_home_vacios.py
          --ignore=tests/test_zix_login_ui.py
          --ignore=tests/test_zix_ui_seguridad.py
          --ignore=tests/test_privacidad_stt.py
          --ignore=tests/test_conversation.py
          --ignore=tests/test_vad.py
          --ignore=tests/test_audio.py

      # Guardar el informe aunque los tests fallen. En el log de GitHub solo
      # se ven los ultimos kilobytes y a veces hay que mirar justo el que
      # importa; aqui queda entero y se descarga desde la ejecucion.
      - name: Subir el informe de los tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.os }}
          path: pytest-${{ matrix.os }}.txt
          if-no-files-found: ignore

  interfaz:
    name: Comprobaciones de la interfaz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: PortAudio
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq portaudio19-dev libsndfile1

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # Mismo motivo que en el job de pruebas, y mismo criterio: si falla, se ve
      # en los skips, no como un fallo del codigo.
      - name: Descargar los modelos de openWakeWord
        continue-on-error: true
        run: python scripts/setup_openwakeword_models.py

      - name: Comprobar que la UI no inventa datos ni sale a la red
        run: python -m pytest tests/ -q -k "chat or home or config or login or seguridad"

  dependencias:
    name: CVEs conocidas
    # Este job corre en WINDOWS a proposito, y por un motivo concreto que
    # solo se ve mirando el log de pip-audit:
    #
    # pip-audit resuelve el fichero de requisitos antes de auditarlo, con
    # 'pip install --dry-run -r <fichero>' y SIN --no-deps (esa opcion solo
    # decide que paquetes se auditan, no si se resuelve). Al resolver en
    # Linux, openwakeword 0.6.0 arrastra 'tflite-runtime;
    # platform_system == "Linux"', que no tiene wheel para cp312 en Linux
    # (0 de sus 9 versiones en PyPI). El lock, al fijar versiones, no
    # deja que pip retroceda a openwakeword 0.4.0 como sí hace con la
    # instalacion flotante, y la resolucion falla.
    #
    # En Windows el mismo lock se instala bien (comprobado: 38 s de
    # instalacion real en un venv limpio), asi que aqui se audita.
    #
    # Los dos ficheros declarados (requirements.txt y requirements-dev.txt)
    # no dependen de la plataforma, asi que auditarlos aqui es igual.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Instalar pip-audit
        run: |
          python -m pip install --upgrade pip
          # Con suelo y sin techo de MAJOR: la herramienta se mantiene
          # actualizada (las versiones dentro de 2.x siguen llegando, y con
          # ellas los parches de seguridad) pero no puede saltar a una major
          # que cambie el formato de la salida que se lee aqui.
          #
          # pip-audit NO esta en requirements.lock, y a proposito: es la
          # herramienta que audita el lock, no parte del entorno que audita.
          # Por eso su version se fija aqui y no con hashes.
          python -m pip install "pip-audit>=2.10.1,<3"

      # Los tres pasos siguientes auditan tres ficheros distintos, y no es
      # repeticion: cada uno responde a una pregunta distinta.
      #
      #   1) requirements.lock      -> lo que se instala DE VERDAD
      #   2) requirements.txt       -> lo declarado, sin fijar
      #   3) requirements-dev.txt   -> lo declarado de desarrollo, sin fijar
      #
      # --strict hace que el paso falle si la RECOLECCION de dependencias
      # falla, no solo si hay vulnerabilidades. Sin el, un 'pip install -r'
      # roto (paquete retirado, red caida) puede pasar por limpio.

      - name: Auditar el entorno real (requirements.lock)
        run: |
          # Este es el fichero que importa: fija las versiones con hashes y
          # es lo que instala el job de reproducibilidad, para produccion y
          # para desarrollo, con sus transitivas.
          #
          # Auditar solo requirements.txt (lo que se hacia antes) daba verde
          # SIEMPRE: no fija versiones, asi que pip-audit resolvia a la
          # ultima publicada y no encontraba nada. El 2026-10-19 se comprobo
          # que el lock tenia 9 CVEs que ese control no veia:
          #   urllib3 2.7.0 (PYSEC-2026-4175/4176/4177) -> 2.8.0
          #   pypdf   6.18.0 (PYSEC-2026-4154/4155/4156/4157/4159/4160) -> 6.19.0
          #
          # --no-deps, y SIN --require-hashes: el lock ya lista TODAS las
          # dependencias, incluidas las transitivas, asi que no hace falta
          # resolver nada. Sin esta opcion, pip-audit crea un venv e intenta
          # instalar el lock, y en Linux eso falla: openwakeword 0.6.0 exige
          # tflite-runtime, que no tiene wheel para cp312 en Linux.
          #
          # Comprobado que sigue detectando: con el lock anterior (9 CVEs)
          # devuelve 'Found 9 known vulnerabilities' y sale con codigo 1.
          #
          # Los hashes los valida otro job: 'reproducibilidad' hace
          # 'pip install --require-hashes', que comprueba el hash de cada
          # fichero descargado. Aqui solo se miran las vulnerabilidades.
          python -m pip_audit -r requirements.lock --no-deps --strict --progress-spinner off

      - name: Auditar lo declarado sin fijar (aviso temprano)
        run: |
          # requirements.txt y requirements-dev.txt NO fijan versiones:
          # resuelven a lo ultimo publicado. Su valor es otro: avisan de que
          # ha aparecido un CVE con arreglo disponible aunque el lock aun no
          # se haya regenerado. Si esto falla y el lock esta limpio, hay un
          # parche pendiente de aplicar al lock.
          #
          # Este paso es el que CUBRE EL ENTORNO DE DESARROLLO, que antes no
          # se auditaba en absoluto: playwright, git-filter-repo y demas.
          python -m pip_audit -r requirements.txt --strict --progress-spinner off
          python -m pip_audit -r requirements-dev.txt --strict --progress-spinner off

  reproducibilidad:
    name: Entorno reproducible (lock)
    # SOLO Windows, y no por capricho: requirements.lock es el entorno de
    # WINDOWS, y no se puede reproducir en Linux.
    #
    # openwakeword==0.6.0 exige 'tflite-runtime; platform_system == "Linux"'
    # y tflite-runtime no publica ninguna wheel para cp312 en Linux (comprobado
    # en PyPI: 0 de sus 9 versiones la tienen). Con el lock fijado, pip no
    # puede retroceder a otra version de openwakeword, y la instalacion
    # falla. Sin fijar (lo que hace el job 'pruebas'), pip retrocede solo a
    # openwakeword 0.4.0, que si instala.
    #
    # Asi que la situacion real es: el lock reproduce WINDOWS, que es la
    # plataforma objetivo del proyecto (ver README), y Linux se comprueba
    # como prueba de portabilidad con la instalacion flotante.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Comprobar que el lock y lo declarado no se han separado
        run: |
          # Si alguien anade una dependencia a requirements.txt o a
          # requirements-dev.txt y no regenera requirements.lock, el entorno
          # reproducible se queda viejo sin que nada lo diga. Esta
          # comprobacion no necesita herramientas nuevas: solo compara
          # listas de nombres, y ademas comprueba que la version fijada
          # cumpla la restriccion declarada.
          python scripts/check_lock_sync.py

      # openwakeword NO trae sus modelos .onnx en el paquete de pip. Sin
      # ellos no arranca el VAD de Silero y la puerta de privacidad del STT
      # se queda cerrada, y los tests que miden audio real fallan.
      #
      # continue-on-error a proposito, igual que en el job de pruebas: si
      # la descarga falla, eso es un problema de red o del runner, no del
      # codigo, y no debe poner rojo el CI. El aviso se ve igual en los
      # skips.
      - name: Descargar los modelos de openWakeWord
        continue-on-error: true
        run: python scripts/setup_openwakeword_models.py

      - name: Comprobar los modelos de openWakeWord
        # shell: bash explicito, por el mismo motivo que en el job de
        # pruebas: sin esto, en Windows este paso corre bajo PowerShell y la
        # sintaxis de bash da ParserError.
        shell: bash
        # Mismo criterio que en el job de pruebas: si la descarga falla, se
        # dice explicitamente que los tests afectados se OMITEN, en vez de
        # dejar el fallo escondido detras de un continue-on-error.
        run: |
          codigo=0
          python scripts/setup_openwakeword_models.py --comprobar || codigo=$?
          if [ "$codigo" -ne 0 ]; then
            echo "::warning::Faltan modelos de openWakeWord (la red o el runner fallaron). Los tests que miden audio real se OMITEN, no se aprueban."
          fi
          exit 0

      - name: Instalar EXACTAMENTE lo que dice el lock
        run: |
          # --require-hashes hace que pip compruebe el hash de cada fichero
          # descargado. Si alguien cambiase un hash del lock, esto falla.
          python -m pip install --require-hashes -r requirements.lock
          # El paquete local va con --no-deps: sus dependencias ya estan
          # fijadas por el lock, y sin --no-deps pip volveria a resolverlas
          # y podria meter versiones distintas de las fijadas.
          python -m pip install -e . --no-deps

      - name: Comprobar que el lock no tiene dependencias de mas
        run: |
          # Esta comprobacion necesita las dependencias INSTALADAS (lee los
          # metadatos del entorno), asi que va DESPUES de instalar.
          #
          # Atrapa un fallo real que ya se dio: pypdf, reportlab y pillow
          # estaban en el lock porque los arrastra pip-audit, la herramienta
          # que audita el lock. No los necesita nada de ZIX, y sus
          # requirentes (pip-audit, pip-requirements-parser) no estaban en
          # el lock: era incoherente.
          python scripts/check_lock_sync.py --sin-huerfanos

      - name: Suite completa sobre el entorno fijado
        # shell: bash explicito, por el mismo motivo que en el job de
        # pruebas: en Windows, PowerShell no tiene 'set -o pipefail'.
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tests/ -q 2>&1 | tee pytest-lock-${{ matrix.os }}.txt

      - name: Subir el informe de los tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-lock-${{ matrix.os }}
          path: pytest-lock-${{ matrix.os }}.txt
          if-no-files-found: ignore

  secretos:
    name: Secretos en el historial
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks necesita TODO el historial. Sin esto solo veria el
          # ultimo commit y un secreto ya reescrito pasaria desapercibido.
          fetch-depth: 0

      - name: Descargar gitleaks (version y checksum fijados)
        run: |
          set -euo pipefail
          VERSION=8.30.1
          SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version

      - name: Escanear el repositorio completo
        run: |
          # --redact no imprime el secreto en el log del CI, que tambien
          # queda registrado en GitHub durante 90 dias.
          /tmp/gitleaks detect \
            --source . \
            --redact \
            --no-banner \
            --exit-code 1

      - name: El .env de ejemplo no debe traer valores reales
        run: |
          if grep -nEi '(KEY|TOKEN|SECRET|PASSWORD)[[:space:]]*=[[:space:]]*[^[:space:]#]{8,}' .env.example; then
            echo "::error::.env.example parece contener un valor real, no un marcador"
            exit 1
          fi
          echo ".env.example limpio"
